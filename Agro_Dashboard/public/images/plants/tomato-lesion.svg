  <!-- Scanner Reticle Corners -->
  <path d="M 40 100 L 40 40 L 100 40" stroke="#22C55E" stroke-width="3" fill="none" />
  <path d="M 760 100 L 760 40 L 700 40" stroke="#22C55E" stroke-width="3" fill="none" />
  <path d="M 40 500 L 40 560 L 100 560" stroke="#22C55E" stroke-width="3" fill="none" />
  <path d="M 760 500 L 760 560 L 700 560" stroke="#22C55E" stroke-width="3" fill="none" />
