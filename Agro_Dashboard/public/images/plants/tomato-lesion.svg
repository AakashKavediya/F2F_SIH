    <ellipse cx="4" cy="-3" rx="65" ry="50" fill="none" stroke="#451A03" stroke-width="3.5" opacity="0.85" />
    <ellipse cx="5" cy="-2" rx="40" ry="32" fill="none" stroke="#1C0A00" stroke-width="4" opacity="0.9" />
    <ellipse cx="6" cy="-2" rx="20" ry="16" fill="#1C0A00" />
