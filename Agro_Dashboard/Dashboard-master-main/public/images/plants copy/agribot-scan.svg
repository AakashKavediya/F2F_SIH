<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="scanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#scanBg)" />

  <!-- Grid overlay -->
  <line x1="100" y1="0" x2="100" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="200" y1="0" x2="200" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="300" y1="0" x2="300" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="400" y1="0" x2="400" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="500" y1="0" x2="500" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="600" y1="0" x2="600" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="700" y1="0" x2="700" y2="600" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />

  <line x1="0" y1="100" x2="800" y2="100" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="0" y1="300" x2="800" y2="300" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="0" y1="400" x2="800" y2="400" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />
  <line x1="0" y1="500" x2="800" y2="500" stroke="#16A34A" stroke-width="0.5" opacity="0.2" />

  <!-- Laser Scanning Line -->
  <line x1="0" y1="280" x2="800" y2="280" stroke="#22C55E" stroke-width="3" opacity="0.85" />
  <polygon points="0,280 800,280 800,240 0,240" fill="#22C55E" opacity="0.12" />

  <!-- Plant Silhouette being scanned -->
  <path d="M 400 480 Q 395 360 405 240 Q 410 180 400 130" stroke="#4ADE80" stroke-width="6" fill="none" opacity="0.8" />
  <ellipse cx="320" cy="340" rx="60" ry="30" fill="#15803D" opacity="0.6" transform="rotate(-25 320 340)" />
  <ellipse cx="480" cy="300" rx="60" ry="30" fill="#15803D" opacity="0.6" transform="rotate(25 480 300)" />
  <ellipse cx="350" cy="220" rx="45" ry="22" fill="#22C55E" opacity="0.7" transform="rotate(-15 350 220)" />
  <ellipse cx="460" cy="180" rx="45" ry="22" fill="#22C55E" opacity="0.7" transform="rotate(15 460 180)" />

  <!-- LiDAR Point Cloud Dots -->
  <circle cx="395" cy="130" r="3" fill="#38BDF8" />
  <circle cx="410" cy="140" r="3" fill="#38BDF8" />
  <circle cx="360" cy="210" r="3" fill="#38BDF8" />
  <circle cx="330" cy="230" r="3" fill="#38BDF8" />
  <circle cx="450" cy="170" r="3" fill="#38BDF8" />
  <circle cx="480" cy="190" r="3" fill="#38BDF8" />
  <circle cx="310" cy="330" r="3" fill="#38BDF8" />
  <circle cx="490" cy="290" r="3" fill="#38BDF8" />

  <!-- Bounding Boxes -->
  <rect x="250" y="110" width="300" height="280" rx="8" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="260" y="85" width="160" height="22" rx="4" fill="#16A34A" />
  <text x="270" y="100" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">CANOPY: VEG-FLOWER</text>

  <!-- Telemetry Badge -->
  <g transform="translate(30, 520)">
    <rect width="740" height="50" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#A7F3D0">
      ROVER: AGB-02 | EDGE INFERENCE: 14.8ms | CHLOROPHYLL INDEX: 0.82 | LESION STATUS: ARRESTED
    </text>
  </g>
</svg>
