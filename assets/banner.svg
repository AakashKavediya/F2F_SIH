<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="FarmerOS - Edge-AI Smart Farming Ecosystem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.5" stop-color="#14532d"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bbf7d0">
        <animate attributeName="stop-color" values="#bbf7d0;#4ade80;#22c55e;#bbf7d0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#bbf7d0;#4ade80;#22c55e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- pulsing glow -->
  <circle cx="600" cy="150" r="240" fill="url(#glow)">
    <animate attributeName="r" values="200;260;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- scanning beam (crop-scanning feel) -->
  <rect y="0" width="160" height="320" fill="url(#scan)">
    <animate attributeName="x" values="-160;1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <g fill="#86efac">
    <circle cx="80" cy="330" r="3" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="330" r="2" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="9s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="330" r="4" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="8s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="330" r="2.5" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="10s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="330" r="3" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="7.5s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="330" r="2" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="9.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="330" r="4" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="8.5s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="330" r="3" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="7s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="330" r="2.5" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="9s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="330" r="3" opacity="0.7"><animate attributeName="cy" values="340;-10" dur="8s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="-1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rolling hills -->
  <path d="M-100 300 C 100 250, 300 290, 500 265 S 900 250, 1300 290 L1300 330 L-100 330 Z" fill="#166534" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M-100 315 C 150 280, 350 310, 600 290 S 950 285, 1300 312 L1300 330 L-100 330 Z" fill="#052e16">
    <animateTransform attributeName="transform" type="translate" values="30 0;-30 0;30 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- growing sprouts -->
  <g fill="#4ade80" stroke="#4ade80" stroke-width="3" stroke-linecap="round">
    <g transform="translate(120 300)"><g><animateTransform attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      <path d="M0 0 V-46" fill="none"/><ellipse cx="-13" cy="-32" rx="15" ry="7" transform="rotate(-30 -13 -32)" stroke="none"/><ellipse cx="13" cy="-42" rx="15" ry="7" transform="rotate(30 13 -42)" stroke="none"/></g></g>
    <g transform="translate(1080 300)"><g><animateTransform attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
      <path d="M0 0 V-46" fill="none"/><ellipse cx="-13" cy="-32" rx="15" ry="7" transform="rotate(-30 -13 -32)" stroke="none"/><ellipse cx="13" cy="-42" rx="15" ry="7" transform="rotate(30 13 -42)" stroke="none"/></g></g>
    <g transform="translate(260 305)"><g><animateTransform attributeName="transform" type="scale" values="0;0.8;0.8;0" keyTimes="0;0.35;0.85;1" dur="7s" begin="-1s" repeatCount="indefinite"/>
      <path d="M0 0 V-46" fill="none"/><ellipse cx="-13" cy="-32" rx="15" ry="7" transform="rotate(-30 -13 -32)" stroke="none"/><ellipse cx="13" cy="-42" rx="15" ry="7" transform="rotate(30 13 -42)" stroke="none"/></g></g>
    <g transform="translate(940 305)"><g><animateTransform attributeName="transform" type="scale" values="0;0.8;0.8;0" keyTimes="0;0.35;0.85;1" dur="7s" begin="-4s" repeatCount="indefinite"/>
      <path d="M0 0 V-46" fill="none"/><ellipse cx="-13" cy="-32" rx="15" ry="7" transform="rotate(-30 -13 -32)" stroke="none"/><ellipse cx="13" cy="-42" rx="15" ry="7" transform="rotate(30 13 -42)" stroke="none"/></g></g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" dur="1.2s" fill="freeze"/>
      <text x="600" y="150" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)">FarmerOS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
      <text x="600" y="198" font-size="26" font-weight="600" fill="#dcfce7" letter-spacing="4">EDGE-AI SMART FARMING ECOSYSTEM</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.2s" fill="freeze"/>
      <text x="600" y="236" font-size="17" fill="#86efac" letter-spacing="1.5">Autonomous ROS 2 Robot  •  IoT Sensors  •  AI Vision  •  Kisan Saathi</text>
    </g>
  </g>
</svg>
