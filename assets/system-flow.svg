<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="FarmerOS system flow: robot and sensors to edge AI, backend, dashboard and Kisan Saathi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#022c22"/>

  <!-- connectors (animated dashes) -->
  <g fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round">
    <path id="p1" d="M240 105 C290 105 290 180 340 180"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p2" d="M240 255 C290 255 290 180 340 180"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p3" d="M550 180 H650"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p4" d="M860 180 C910 180 910 105 960 105"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p5" d="M860 180 C910 180 910 255 960 255"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- data packets -->
  <g fill="#bbf7d0">
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240 105 C290 105 290 180 340 180"/></circle>
    <circle r="6"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M240 255 C290 255 290 180 340 180"/></circle>
    <circle r="6"><animateMotion dur="1.8s" repeatCount="indefinite" path="M550 180 H650"/></circle>
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M860 180 C910 180 910 105 960 105"/></circle>
    <circle r="6"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M860 180 C910 180 910 255 960 255"/></circle>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="30" y="70" width="210" height="70" rx="16" fill="url(#node)" stroke="#4ade80" stroke-width="2"/>
      <text x="135" y="100" font-size="24">🤖</text>
      <text x="135" y="125" font-size="16" font-weight="700" fill="#dcfce7">ROS 2 Robot</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="30" y="220" width="210" height="70" rx="16" fill="url(#node)" stroke="#4ade80" stroke-width="2"/>
      <text x="135" y="250" font-size="24">📡</text>
      <text x="135" y="275" font-size="16" font-weight="700" fill="#dcfce7">IoT Sensors</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="340" y="145" width="210" height="70" rx="16" fill="url(#node)" stroke="#86efac" stroke-width="2.5"/>
      <text x="445" y="175" font-size="24">🧠</text>
      <text x="445" y="200" font-size="16" font-weight="700" fill="#dcfce7">Edge AI (ML / DL)</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="650" y="145" width="210" height="70" rx="16" fill="url(#node)" stroke="#86efac" stroke-width="2.5"/>
      <text x="755" y="175" font-size="24">☁️</text>
      <text x="755" y="200" font-size="16" font-weight="700" fill="#dcfce7">Backend</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="960" y="70" width="210" height="70" rx="16" fill="url(#node)" stroke="#4ade80" stroke-width="2"/>
      <text x="1065" y="100" font-size="24">📊</text>
      <text x="1065" y="125" font-size="16" font-weight="700" fill="#dcfce7">Agro Dashboard</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="960" y="220" width="210" height="70" rx="16" fill="url(#node)" stroke="#4ade80" stroke-width="2"/>
      <text x="1065" y="250" font-size="24">📱</text>
      <text x="1065" y="275" font-size="16" font-weight="700" fill="#dcfce7">Kisan Saathi</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="-2.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- captions -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-size="13" fill="#86efac">
    <text x="135" y="165">crop scouting</text>
    <text x="135" y="315">soil &amp; climate data</text>
    <text x="445" y="240">detect · diagnose · decide</text>
    <text x="755" y="240">store · route · alert</text>
    <text x="1065" y="165">real-time analytics</text>
    <text x="1065" y="315">farmer alerts</text>
    <text x="600" y="355" font-size="14" fill="#4ade80">Precision irrigation and timely alerts flow back to the field</text>
  </g>
</svg>
